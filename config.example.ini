[remoteplay]
dummy = HDMI-A-2

mode = auto
min_mode = 1920x1080
fallback_mode = 1920x1080@120

auto = true
inhibit_idle = true
scratch_desktop = true
scratch_desktop_name = Streaming

steam_log = ~/.steam/steam/logs/streaming_log.txt
capture_hint_max_age = 120
settle_timeout = 10.0

# outputs behind an MST hub, switched in their own stage (see README)
#staged = DP-4, DP-5
